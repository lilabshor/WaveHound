<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#081026"/>
      <stop offset="100%" stop-color="#03050c"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1833" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#091024" stop-opacity="0.92"/>
    </linearGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#00f2fe" flood-opacity="0.12"/>
    </filter>

    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10b981" flood-opacity="0.18"/>
    </filter>

    <style>
      @keyframes pulsePath {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      .anim-flow {
        stroke-dasharray: 8 6;
        animation: pulsePath 2.4s linear infinite;
      }
      .anim-pulse {
        animation: pulseGlow 2s ease-in-out infinite;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .code-font {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="url(#bg-grad)"/>

  <!-- Grid Overlay -->
  <g opacity="0.12">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200 M0,630 H1200" stroke="#38bdf8" stroke-width="0.5"/>
    <path d="M100,0 V680 M200,0 V680 M300,0 V680 M400,0 V680 M500,0 V680 M600,0 V680 M700,0 V680 M800,0 V680 M900,0 V680 M1000,0 V680 M1100,0 V680" stroke="#38bdf8" stroke-width="0.5"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(55, 34)">
    <rect x="0" y="0" width="195" height="24" rx="12" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
    <circle cx="13" cy="12" r="4" fill="#38bdf8" class="anim-pulse"/>
    <text x="25" y="16" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">SYSTEM ARCHITECTURE</text>

    <text x="0" y="54" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="-0.5">WaveHound - Bluetooth Indoor Hunt &amp; Trilateration</text>
    <text x="0" y="75" fill="#94a3b8" font-size="13">Passive BLE Advertising | Log-Distance Path Loss | Kalman 1D + Gauss-Newton 2D | Privacy by Design</text>
  </g>

  <!-- Meta Badges (Right Header) -->
  <g transform="translate(865, 34)">
    <rect x="0" y="0" width="280" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="18" fill="#64748b" font-size="10" font-weight="600">ENTERPRISE PRIVACY VALIDATION</text>
    <text x="15" y="36" fill="#10b981" font-size="12" font-weight="700">Enroll-Only &amp; Zero MAC Storage</text>
  </g>

  <!-- ZONE 1: Edge Scanners (Left Column) -->
  <rect x="45" y="130" width="340" height="515" rx="12" fill="#0b1329" fill-opacity="0.7" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>
  <text x="65" y="158" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">01 / EDGE SENSORS &amp; SCANNERS</text>

  <!-- Card 1A: Passive BLE Scanning -->
  <g transform="translate(60, 175)" filter="url(#glow-card)">
    <rect width="310" height="130" rx="8" fill="url(#card-grad)" stroke="#0284c7" stroke-width="1"/>
    <text x="16" y="24" fill="#ffffff" font-size="13" font-weight="700">Passive BLE Sniffer (Zero Wakeup)</text>
    <text x="16" y="44" fill="#94a3b8" font-size="11">Channels: 37, 38, 39 (Advertising only)</text>
    <text x="16" y="62" fill="#94a3b8" font-size="11">Non-intrusive: Tanpa GATT connection</text>
    <text x="16" y="80" fill="#94a3b8" font-size="11">Hardware: Linux / Raspberry Pi / Workstation</text>
    <rect x="16" y="96" width="278" height="20" rx="4" fill="#0284c7" fill-opacity="0.2"/>
    <text x="24" y="110" fill="#38bdf8" class="code-font" font-size="10">Raw RSSI Stream [ -90 s/d -40 dBm ]</text>
  </g>

  <!-- Card 1B: Edge Dedup & EMA -->
  <g transform="translate(60, 320)" filter="url(#glow-card)">
    <rect width="310" height="135" rx="8" fill="url(#card-grad)" stroke="#0284c7" stroke-width="1"/>
    <text x="16" y="24" fill="#ffffff" font-size="13" font-weight="700">Edge Dedup &amp; Smoothing (EMA)</text>
    <text x="16" y="44" fill="#94a3b8" font-size="11">EMA Filter: alpha = 0.40 (Perataan awal)</text>
    <text x="16" y="62" fill="#94a3b8" font-size="11">Staleness Sweeper: Evict &gt; 30 detik</text>
    <text x="16" y="80" fill="#94a3b8" font-size="11">Batching Ingest: Interval 3.0 detik</text>
    <rect x="16" y="96" width="278" height="24" rx="4" fill="#10b981" fill-opacity="0.15"/>
    <text x="24" y="112" fill="#34d399" font-size="10" font-weight="600">Bandwidth Throttled: Max 200 readings/batch</text>
  </g>

  <!-- Card 1C: Local Resilient Buffer -->
  <g transform="translate(60, 470)" filter="url(#glow-card)">
    <rect width="310" height="155" rx="8" fill="url(#card-grad)" stroke="#0284c7" stroke-width="1"/>
    <text x="16" y="24" fill="#ffffff" font-size="13" font-weight="700">Offline SQLite/WAL Resilient Buffer</text>
    <text x="16" y="44" fill="#94a3b8" font-size="11">Antrean lokal saat jaringan terputus</text>
    <text x="16" y="62" fill="#94a3b8" font-size="11">NTP Clock Sync Check (&lt; 2 detik offset)</text>
    <text x="16" y="80" fill="#94a3b8" font-size="11">Auto-Retry backoff eksponensial + jitter</text>
    <rect x="16" y="98" width="278" height="42" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="114" fill="#64748b" font-size="9">HEARTBEAT &amp; TELEMETRY</text>
    <text x="24" y="128" fill="#38bdf8" class="code-font" font-size="10">uptime | cpu_temp | queue_size | clock_drift</text>
  </g>

  <!-- Flow 1 to 2 Connector -->
  <path d="M370,240 H425" stroke="#00f2fe" stroke-width="2" class="anim-flow"/>
  <polygon points="425,236 433,240 425,244" fill="#00f2fe"/>
  <rect x="375" y="218" width="50" height="18" rx="4" fill="#060d1f" stroke="#0284c7" stroke-width="0.8"/>
  <text x="382" y="231" fill="#38bdf8" font-size="9" font-weight="600">HTTPS</text>

  <!-- ZONE 2: Central Engine & Estimation (Middle Column) -->
  <rect x="430" y="130" width="340" height="515" rx="12" fill="#0b1329" fill-opacity="0.7" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>
  <text x="450" y="158" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">02 / ESTIMATION &amp; PRIVACY ENGINE</text>

  <!-- Card 2A: Cryptographic Identity Resolution -->
  <g transform="translate(445, 175)" filter="url(#glow-card)">
    <rect width="310" height="130" rx="8" fill="url(#card-grad)" stroke="#0284c7" stroke-width="1"/>
    <text x="16" y="24" fill="#ffffff" font-size="13" font-weight="700">Identity Resolution (Anti-Stalking)</text>
    <text x="16" y="44" fill="#94a3b8" font-size="11">RPA Match: AES-128(IRK, prand) 24-bit hash</text>
    <text x="16" y="62" fill="#94a3b8" font-size="11">Companion: HMAC(K, floor(t/60)) rolling token</text>
    <text x="16" y="80" fill="#94a3b8" font-size="11">Strict Allowlist: Unenrolled otomatis disamarkan</text>
    <rect x="16" y="96" width="278" height="20" rx="4" fill="#ef4444" fill-opacity="0.15"/>
    <text x="24" y="110" fill="#f87171" class="code-font" font-size="10">Redacted: [telepon] (bukan perangkat Anda)</text>
  </g>

  <!-- Card 2B: Kalman 1D Filter -->
  <g transform="translate(445, 320)" filter="url(#glow-card)">
    <rect width="310" height="135" rx="8" fill="url(#card-grad)" stroke="#0284c7" stroke-width="1"/>
    <text x="16" y="24" fill="#ffffff" font-size="13" font-weight="700">Adaptive Kalman Filter 1D</text>
    <text x="16" y="44" fill="#94a3b8" font-size="11">Process Noise Q = 0.05 | Measure Noise R = 4.0</text>
    <text x="16" y="62" fill="#94a3b8" font-size="11">Adaptive Kalman Gain K = P / (P + R)</text>
    <text x="16" y="80" fill="#94a3b8" font-size="11">Model Path-Loss: d = d0 * 10^((Tx - RSSI)/(10n))</text>
    <rect x="16" y="96" width="278" height="24" rx="4" fill="#0284c7" fill-opacity="0.2"/>
    <text x="24" y="112" fill="#38bdf8" font-size="10" font-weight="600">Distance Error MAE: 1.36 m (Noise 2 dB)</text>
  </g>

  <!-- Card 2C: Gauss-Newton Trilateration -->
  <g transform="translate(445, 470)" filter="url(#glow-card)">
    <rect width="310" height="155" rx="8" fill="url(#card-grad)" stroke="#0284c7" stroke-width="1"/>
    <text x="16" y="24" fill="#ffffff" font-size="13" font-weight="700">Gauss-Newton 2D Multilateration</text>
    <text x="16" y="44" fill="#94a3b8" font-size="11">Non-linear least-squares: J^T J delta = -J^T r</text>
    <text x="16" y="62" fill="#94a3b8" font-size="11">Proteksi Determinan Singular: |det| &lt; 1e-15</text>
    <text x="16" y="80" fill="#94a3b8" font-size="11">Keyakinan Posisi: Residual RMS &lt; 4.0 m (High)</text>
    <rect x="16" y="98" width="278" height="42" rx="4" fill="#10b981" fill-opacity="0.15"/>
    <text x="24" y="114" fill="#34d399" font-size="9" font-weight="600">VALIDASI ILMIAH E2E TERUJI</text>
    <text x="24" y="128" fill="#ffffff" class="code-font" font-size="10">E2E Position Error: 0.94 m (Room 8x6m)</text>
  </g>

  <!-- Flow 2 to 3 Connector -->
  <path d="M755,240 H810" stroke="#00f2fe" stroke-width="2" class="anim-flow"/>
  <polygon points="810,236 818,240 810,244" fill="#00f2fe"/>
  <rect x="760" y="218" width="50" height="18" rx="4" fill="#060d1f" stroke="#0284c7" stroke-width="0.8"/>
  <text x="766" y="231" fill="#38bdf8" font-size="9" font-weight="600">SQL/TCP</text>

  <!-- ZONE 3: Storage & Field Operations (Right Column) -->
  <rect x="815" y="130" width="340" height="515" rx="12" fill="#0b1329" fill-opacity="0.7" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>
  <text x="835" y="158" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">03 / DATABASE &amp; OPERATOR SUITE</text>

  <!-- Card 3A: MySQL Enterprise Storage -->
  <g transform="translate(830, 175)" filter="url(#glow-card)">
    <rect width="310" height="130" rx="8" fill="url(#card-grad)" stroke="#0284c7" stroke-width="1"/>
    <text x="16" y="24" fill="#ffffff" font-size="13" font-weight="700">MySQL 8.0 &amp; SQLite Storage</text>
    <text x="16" y="44" fill="#94a3b8" font-size="11">Tabel: sites, nodes, devices_enrolled</text>
    <text x="16" y="62" fill="#94a3b8" font-size="11">Tabel: readings, positions, tickets, alerts</text>
    <text x="16" y="80" fill="#94a3b8" font-size="11">Retensi 30 Hari: TTL Job purge otomatis</text>
    <rect x="16" y="96" width="278" height="20" rx="4" fill="#0284c7" fill-opacity="0.2"/>
    <text x="24" y="110" fill="#38bdf8" class="code-font" font-size="10">Zero raw MAC address persistence</text>
  </g>

  <!-- Card 3B: Cryptographic Audit Trail -->
  <g transform="translate(830, 320)" filter="url(#glow-card)">
    <rect width="310" height="135" rx="8" fill="url(#card-grad)" stroke="#0284c7" stroke-width="1"/>
    <text x="16" y="24" fill="#ffffff" font-size="13" font-weight="700">Tamper-Evident Audit Log</text>
    <text x="16" y="44" fill="#94a3b8" font-size="11">Append-only log dengan SHA-256 hash chaining</text>
    <text x="16" y="62" fill="#94a3b8" font-size="11">Chain: prev_hash -&gt; entry_hash</text>
    <text x="16" y="80" fill="#94a3b8" font-size="11">Syarat Lokasi: Wajib tiket laporan kehilangan</text>
    <rect x="16" y="96" width="278" height="24" rx="4" fill="#10b981" fill-opacity="0.15"/>
    <text x="24" y="112" fill="#34d399" font-size="10" font-weight="600">Anti-Penyalahgunaan: Kueri tanpa tiket DITOLAK</text>
  </g>

  <!-- Card 3C: Operator CLI & QR Onboarding -->
  <g transform="translate(830, 470)" filter="url(#glow-card)">
    <rect width="310" height="155" rx="8" fill="url(#card-grad)" stroke="#0284c7" stroke-width="1"/>
    <text x="16" y="24" fill="#ffffff" font-size="13" font-weight="700">Field Operator CLI &amp; QR Onboarding</text>
    <text x="16" y="44" fill="#94a3b8" font-size="11">Mode Survey: Radar kekuatan sinyal sekitar</text>
    <text x="16" y="62" fill="#94a3b8" font-size="11">Mode Hunt: Panduan klik audio (1 Hz s/d 18 Hz)</text>
    <text x="16" y="80" fill="#94a3b8" font-size="11">Audio Stop: Otomatis hening bila sinyal stale &gt; 5s</text>
    <rect x="16" y="98" width="278" height="42" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="114" fill="#64748b" font-size="9">UNIVERSAL MOBILE ENROLLMENT</text>
    <text x="24" y="128" fill="#38bdf8" class="code-font" font-size="10">Scan QR Kamera HP -&gt; Auto Pairing Instant</text>
  </g>

  <!-- Global Footer -->
  <text x="60" y="665" fill="#475569" font-size="11">WaveHound Protocol Specification v0.1.0 | Pure Python Stdlib Core | MySQL 8.0 &amp; SQLite Dual Engine</text>
  <text x="965" y="665" fill="#475569" font-size="11" text-anchor="end">Engine Verified: 16/16 Numeric Tests PASS</text>
</svg>
